# Release workflow for terraform-provider-silk.
# Triggers on a pushed semver tag (v*), imports the GPG signing key, and runs
# GoReleaser to build, sign, and publish the GitHub release that the Terraform
# Registry ingests.
#
# Required repo secrets:
#   GPG_PRIVATE_KEY - ASCII-armored private key (gpg --armor --export-secret-keys)
#   PASSPHRASE      - passphrase for that key (omit if the key has none)

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
